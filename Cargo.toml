[workspace]
resolver = "2"
members = ["engine", "crates/app", "crates/build", "crates/planner", "crates/ui", "crates/library", "crates/notes"]
default-members = ["crates/app"]
exclude = ["legacy/src-tauri", "prototypes/gpui-tree", "tree-renderer"]

[workspace.package]
version = "1.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
hsplanner-notes={path="crates/notes"}
hsplanner-library={path="crates/library"}
hsplanner-engine = { package = "HSPlanner", path = "engine", default-features = false }
hsplanner-build = { path = "crates/build" }
hsplanner-planner = { path = "crates/planner" }
hsplanner-ui = { path = "crates/ui" }
gpui-kit = "=0.6.0"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
debug = 0
opt-level = 3
lto = true
codegen-units = 1
strip = true
