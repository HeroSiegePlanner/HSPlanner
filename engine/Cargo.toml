[package]
name = "HSPlanner"
version = "0.9.1" # Compatibility package version; desktop versions belong to their app crates.
description = "HSPlanner"
authors = ["zium1337"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.82"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[example]]
name = "ocr_dump"
required-features = ["ocr"]

[features]
default = []
ocr = ["dep:ocrs", "dep:rten", "dep:image"]
suggestions = ["dep:rayon"]

[dependencies]
serde_json = "1.0.150"
serde = { version = "1.0.228", features = ["derive"] }
log = "0.4.31"
regex = "1.12.3"
rayon = { version = "1", optional = true }
ocrs = { version = "0.13.0", optional = true }
rten = { version = "0.26.0", optional = true }
image = { version = "0.25.6", default-features = false, features = ["png", "jpeg"], optional = true }
base64 = "0.23.1"
