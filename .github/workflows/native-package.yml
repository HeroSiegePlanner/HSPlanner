name: Native installers

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit to package
        type: string
        required: true
      include_macos:
        description: Include the Apple Silicon DMG in a release
        type: boolean
        default: false
    secrets:
      HSPLANNER_BUG_REPORT_URL:
        required: false
      VITE_BUG_REPORT_URL:
        required: false
      HSPLANNER_WINDOWS_SIGN_COMMAND:
        required: false
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  package:
    if: github.event_name != 'pull_request' || github.event.label.name == 'installers'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.include_macos && '["windows-2022", "ubuntu-24.04", "macos-15"]' || '["windows-2022", "ubuntu-24.04"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake pkg-config libssl-dev libfontconfig1-dev \
            libfreetype6-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libvulkan-dev libasound2-dev libudev-dev libdbus-1-dev libdrm-dev \
            libgbm-dev libx11-xcb-dev libxcb-randr0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxcb-xkb-dev
      - name: Linux packaging dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get install -y patchelf desktop-file-utils libfuse2t64
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          key: native-installers-${{ runner.os }}-${{ runner.arch }}
      - name: Install pinned packager
        run: cargo install cargo-packager --version 0.11.8 --locked
      - name: Build native installers
        shell: bash
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in
            macOS) formats='["app","dmg"]'; export MACOSX_DEPLOYMENT_TARGET=15.0 ;;
            Windows) formats='["nsis"]' ;;
            Linux) formats='["deb","appimage","pacman"]' ;;
          esac
          cargo build -p hsplanner --locked --release
          # cargo-packager is a native Windows program there, so it needs Windows paths.
          root=$(cygpath -m "$PWD" 2>/dev/null || echo "$PWD")
          out=target/packages/release
          mkdir -p "$out"
          version=$(tr -d '\r' < Cargo.toml | sed -n '/^\[workspace.package\]/,/^\[/ s/^version = "\(.*\)"/\1/p')
          test -n "$version"
          jq --arg version "$version" --arg root "$root" --argjson formats "$formats" '
            .version = $version
            | .icons = [.icons[] | "\($root)/packaging/\(.)"]
            | .resources = [.resources[] | .src = "\($root)/packaging/\(.src)"]
            | .binariesDir = "\($root)/target/release"
            | .outDir = "\($root)/target/packages/release"
            | .formats = $formats
            | if (env.HSPLANNER_MACOS_SIGNING_IDENTITY // "") != "" then .macos.signingIdentity = env.HSPLANNER_MACOS_SIGNING_IDENTITY else . end
            | if (env.HSPLANNER_WINDOWS_SIGN_COMMAND // "") != "" then .windows = {signCommand: env.HSPLANNER_WINDOWS_SIGN_COMMAND} else . end
          ' packaging/packager.json > "$out/packager.json"
          cargo-packager --config "$out/packager.json"
          cd "$out"
          shopt -s nullglob
          packages=(*.dmg *.exe *.deb *.AppImage *.tar.gz)
          (( ${#packages[@]} )) || { echo "::error::No packages were built."; exit 1; }
          command -v sha256sum >/dev/null || sha256sum() { shasum -a 256 "$@"; }
          # Git Bash marks binary mode with '*'; release verification expects two spaces.
          sha256sum "${packages[@]}" | sed 's/ \*/  /' > SHA256SUMS
          cat SHA256SUMS
        env:
          HSPLANNER_BUG_REPORT_URL: ${{ secrets.HSPLANNER_BUG_REPORT_URL || secrets.VITE_BUG_REPORT_URL }}
          HSPLANNER_WINDOWS_SIGN_COMMAND: ${{ secrets.HSPLANNER_WINDOWS_SIGN_COMMAND }}
      - name: Upload installers for review
        uses: actions/upload-artifact@v7
        with:
          name: hsplanner-${{ runner.os }}-${{ runner.arch }}
          if-no-files-found: error
          overwrite: true
          path: |
            target/packages/release/*.exe
            target/packages/release/*.dmg
            target/packages/release/*.deb
            target/packages/release/*.AppImage
            target/packages/release/*.tar.gz
            target/packages/release/PKGBUILD
            target/packages/release/SHA256SUMS
