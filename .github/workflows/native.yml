name: Native GPUI

on:
  push:
    branches: [main, main-private]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit to test
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: native-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-22.04
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake pkg-config libssl-dev libfontconfig1-dev \
            libfreetype6-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libvulkan-dev libasound2-dev libudev-dev libdbus-1-dev libdrm-dev \
            libgbm-dev libx11-xcb-dev libxcb-randr0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxcb-xkb-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          key: ubuntu-22.04
      - name: Formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Workspace tests including native OCR
        run: cargo test --workspace --locked
      - name: Existing calculation fixtures
        run: cargo test -p hsplanner-engine --no-default-features --test parity --locked
