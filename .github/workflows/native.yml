name: Native GPUI

on:
  push:
    branches: [main, main-private]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit to test
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: native-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Release tooling tests
        run: python -m unittest discover -s tools -p test_release.py
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake pkg-config libssl-dev libfontconfig1-dev \
            libfreetype6-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libvulkan-dev libasound2-dev libudev-dev libdbus-1-dev libdrm-dev \
            libgbm-dev libx11-xcb-dev libxcb-randr0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxcb-xkb-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
      - name: Workspace tests including native OCR
        run: cargo test --workspace --locked
      - name: Engine and isolated integrations
        run: cargo test -p HSPlanner --no-default-features --features ocr,suggestions --lib --examples --locked
      - name: Existing calculation fixtures
        run: cargo test -p HSPlanner --no-default-features --test parity --locked
