name: Native GPUI

on:
  push:
    branches: [main, main-private]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '15.0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v7
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake pkg-config libssl-dev libfontconfig1-dev \
            libfreetype6-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libvulkan-dev libasound2-dev libudev-dev libdbus-1-dev libdrm-dev \
            libgbm-dev libx11-xcb-dev libxcb-randr0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxcb-xkb-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          key: native-${{ runner.os }}-${{ runner.arch }}
      - name: Build native application
        run: cargo build -p hsplanner --locked
      - name: Documents, persistence and preview operations
        run: cargo test -p hsplanner-build -p hsplanner-planner --locked
      - name: Engine and isolated integrations
        run: cargo test -p HSPlanner --no-default-features --features ocr,suggestions --lib --locked
      - name: Existing calculation fixtures
        run: cargo test -p HSPlanner --no-default-features --test parity --locked
      - name: Reject X11 instead of falling back
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if env -u WAYLAND_DISPLAY DISPLAY=:99 ./target/debug/hsplanner 2> rejection.txt; then
            echo 'Native application unexpectedly accepted an X11-only session'
            exit 1
          fi
          grep -q 'requires a native Wayland session' rejection.txt
