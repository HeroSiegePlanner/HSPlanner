name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
          - platform: windows-latest
          - platform: macos-latest

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './engine -> target'

      - name: Install npm dependencies
        run: npm ci

      - name: Read CHANGELOG.md
        id: changelog
        shell: bash
        run: |
          if [ -f CHANGELOG.md ]; then
            {
              echo 'body<<__CHANGELOG_EOF__'
              cat CHANGELOG.md
              echo
              echo '__CHANGELOG_EOF__'
            } >> "$GITHUB_OUTPUT"
          else
            echo 'body=Auto-built release.' >> "$GITHUB_OUTPUT"
          fi

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_GIST_TOKEN: ${{ secrets.VITE_GIST_TOKEN }}
          VITE_WEB_SHARE_CREATE_URL: ${{ vars.VITE_WEB_SHARE_CREATE_URL }}
          VITE_WEB_SHARE_GET_URL: ${{ vars.VITE_WEB_SHARE_GET_URL }}
          VITE_BUG_REPORT_URL: ${{ secrets.VITE_BUG_REPORT_URL }}
        with:
          tagName: ${{ inputs.tag }}
          releaseName: ${{ inputs.tag }}
          releaseBody: ${{ steps.changelog.outputs.body }}
          releaseDraft: false
          prerelease: ${{ inputs.prerelease }}

      - name: Rename installers (remove version from filename)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          cd dist/
          # Rename Windows setup exe (remove version)
          if ls HSPlanner-*_x64-setup.exe 1> /dev/null 2>&1; then
            mv HSPlanner-*_x64-setup.exe HSPlanner-x64-setup.exe
          fi
          # Rename macOS dmg (remove version)
          if ls HSPlanner-*_arch64.dmg 1> /dev/null 2>&1; then
            mv HSPlanner-*_arch64.dmg HSPlanner-x64.dmg
          fi
          # Rename Linux deb (remove version)
          if ls HSPlanner-*_amd64.deb 1> /dev/null 2>&1; then
            mv HSPlanner-*_amd64.deb HSPlanner-amd64.deb
          fi
          # Rename Linux rpm (remove version)
          if ls HSPlanner-*-1-x86_64.rpm 1> /dev/null 2>&1; then
            mv HSPlanner-*-1-x86_64.rpm HSPlanner-x86_64.rpm
          fi
          # Rename Linux AppImage (remove version)
          if ls HSPlanner-*_amd64.AppImage 1> /dev/null 2>&1; then
            mv HSPlanner-*_amd64.AppImage HSPlanner-amd64.AppImage
          fi

      - name: Upload renamed installers to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          cd dist/
          gh release upload ${{ inputs.tag }} \
            HSPlanner-x64-setup.exe \
            HSPlanner-x64.dmg \
            HSPlanner-amd64.deb \
            HSPlanner-x86_64.rpm \
            HSPlanner-amd64.AppImage \
            --clobber 2>/dev/null || true

  # ubuntu-22.04 libs bundled into the AppImage (libwayland, glib, systemd...) shadow
  # newer host libs and break EGL on Mesa 25+ distros -> white screen (tauri#15665).
  # Strip them, repack, re-sign, and fix the updater manifest.
  fix-appimage:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Download AppImage from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download ${{ inputs.tag }} -R ${{ github.repository }} -p '*_amd64.AppImage'

      - name: Strip over-bundled libs and repack
        run: |
          APPIMAGE=$(ls *_amd64.AppImage)
          chmod +x "$APPIMAGE"
          ./"$APPIMAGE" --appimage-extract
          rm -f squashfs-root/usr/lib/{libwayland-*,libglib-*,libgio-*,libgobject-*,libgmodule-*,libgst*,libmount*,libblkid*,libselinux*,libpcre2-*,libsystemd*,libudev*,libgudev*,liblzma*,liblz4*,libzstd*,libcap*,libgcrypt*,libdbus-1*,libseccomp*,libdw*,libelf*,libffi*,libbsd*,libmd*}
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ARCH=x86_64 ./appimagetool-x86_64.AppImage --appimage-extract-and-run --comp zstd squashfs-root "$APPIMAGE"

      - name: Re-sign and update release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          APPIMAGE=$(ls *_amd64.AppImage)
          npx --yes @tauri-apps/cli@2.11.2 signer sign "$APPIMAGE"
          gh release upload ${{ inputs.tag }} "$APPIMAGE" "$APPIMAGE.sig" --clobber -R ${{ github.repository }}
          gh release download ${{ inputs.tag }} -R ${{ github.repository }} -p latest.json
          ASSET_URL=$(gh api repos/${{ github.repository }}/releases/tags/${{ inputs.tag }} --jq ".assets[] | select(.name==\"$APPIMAGE\") | .url")
          SIG=$(cat "$APPIMAGE.sig")
          jq --arg sig "$SIG" --arg url "$ASSET_URL" \
            '.platforms["linux-x86_64"] |= (.signature=$sig | .url=$url)
             | .platforms["linux-x86_64-appimage"] |= (.signature=$sig | .url=$url)' \
            latest.json > latest.json.tmp && mv latest.json.tmp latest.json
          gh release upload ${{ inputs.tag }} latest.json --clobber -R ${{ github.repository }}

  # Tauri has no pacman bundler, so repack the deb payload into a pacman package.
  build-arch:
    needs: build
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm --needed github-cli

      - name: Download deb from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download ${{ inputs.tag }} -R ${{ github.repository }} -p '*.deb'

      - name: Repack deb into pacman package
        env:
          TAG: ${{ inputs.tag }}
        run: |
          DEB=$(ls *.deb)
          VERSION=${TAG#v}
          cat > PKGBUILD <<EOF
          pkgname=hsplanner-bin
          pkgver=${VERSION//-/_}
          pkgrel=1
          pkgdesc="Hero Siege build planner"
          arch=('x86_64')
          url="https://github.com/${{ github.repository }}"
          license=('custom')
          depends=('webkit2gtk-4.1' 'gtk3')
          provides=('hsplanner')
          conflicts=('hsplanner')
          options=('!strip' '!debug')
          source=("$DEB")
          noextract=("$DEB")
          sha256sums=('SKIP')

          package() {
            cd "\$srcdir"
            bsdtar -xf "$DEB"
            bsdtar -xf data.tar.* -C "\$pkgdir"
          }
          EOF
          useradd -m builder
          chown -R builder .
          su builder -c "makepkg --nodeps --noconfirm"

      - name: Upload pacman package to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ inputs.tag }} *.pkg.tar.zst --clobber -R ${{ github.repository }}
