version: 2
updates:
  # Native Rust workspace
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      serde:
        patterns:
          - "serde"
          - "serde_*"
      # Catch-all: everything ungrouped, minor/patch in one PR
      cargo-misc:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # Bundle every GitHub Actions update (incl. major) into one PR
      actions:
        patterns:
          - "*"
